name: Bug report
description: Report a reproducible problem without sensitive camera data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, addresses, serial numbers, or unsanitized responses.
  - type: input
    id: version
    attributes:
      label: hikvision-mcp version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: sanitization
    attributes:
      label: Sanitization
      options:
        - label: I removed credentials and identifying camera or network data.
          required: true
